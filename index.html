<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Optimizely Web Experimentation snippet — must load synchronously and
         as early as possible in <head> to avoid flicker. Do not add async/defer. -->
    <script src="https://cdn.optimizely.com/public/26942930964/s/infinite.js"></script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Showcase" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Safe fallback meta — per-page SSR overrides these in ssr-handler.tsx.
         Kept generic so an unmatched route doesn't show a brand-specific title. -->
    <meta name="description" content="Optimizely Showcase — AI-generated 1:1 brand experiences powered by Opal and Optimizely Graph." />
    <title>Optimizely Showcase</title>

    <!-- OpenSearch: lets browsers register us as a search provider
         (the address bar "Add to search engines" entry, etc.). -->
    <link rel="search"
          type="application/opensearchdescription+xml"
          title="Optimizely Showcase"
          href="/opensearch.xml" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.brandfetch.io" crossorigin />
    <link rel="preconnect" href="https://d1igp3oop3iho5.cloudfront.net" crossorigin />
    <link rel="dns-prefetch" href="https://www.optimizely.com" />

    <!-- Google Fonts - async loaded to avoid render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" /></noscript>

    <!-- Greenfield brand display/body fonts (self-hosted) — preload the two most-visible cuts -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/vc-nudge/NudgeSemiNormal-SemiNormalExtraBold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/die-grotesk/die-grotesk-b-regular.woff2" crossorigin />

    <!-- Brightstream (finserv template) fonts — Playfair Display + Jost, matching financial-services.optidemo.com -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Jost:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Jost:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Jost:wght@300;400;500;600&display=swap" /></noscript>

    <!-- ODP (Optimizely Data Platform) tracking SDK — async, non-blocking -->
    <script>window.zaius=window.zaius||[];</script>
    <script src="https://d1igp3oop3iho5.cloudfront.net/v2/8yoUTdBkNwpVOLCXeZpKdw/zaius-min.js" async></script>

    <!-- Inline critical CSS to prevent FOUC and speed up FCP -->
    <style>
      body{background-color:#10141d;color:#e9ebf1;margin:0;font-family:'Figtree',Arial,sans-serif}
      #root{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
